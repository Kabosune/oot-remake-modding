# KaeGae symbol pack for main build E0F3CCFAF50065AE4EA01EB5AEB13B1A45DA3348 (game version 1.1.1).
#
# Everything KaeGae Core knows about this build of the game is in this file. Offsets are module
# offsets (address in the docs minus 0x80020000). tools/kaegae_symbols.py turns the packs into
# the table compiled into Core; mods ask for these by name (kae_sym, kae_field).
#
# `ld` names the same thing in symbols/e0f3ccfa.ld (the file the IPS mods link against);
# tests/test_kaegae_symbols.py checks that the two agree. How each was found is in
# docs/address-map.md and docs/structures.md.

build   = "E0F3CCFAF50065AE4EA01EB5AEB13B1A45DA3348"
version = "1.1.1"

[detect]                    # how Core recognises this build from inside the game
nnmain = 0x1202CD0          # nnMain
mod0   = 0x3C4705C          # main's MOD0 header
size   = 0x4EA0000          # mapped size of main

[core]
hook-slots = 0x4E9FB00      # one 8-byte function pointer per hook point (docs/memory-map.md)
hook-code  = "0x3C46310..0x3C46400"   # where Core's patch puts its hook stubs (registry claim)

# ---- hook points: places in main's code that Core's patch redirects ----

[hookpoint."Actor.MoveUpdate"]
site    = 0x2C215E4         # second instruction of the movement update, f_82c415e0
slot    = 0
stub    = "kp_hook_move"   # in api/core/hookpoints.S
replaces = 0xFC180FEA       # str d10, [sp, #-0x80]!
context = "x0 = actor; runs for every physics actor every frame on the game's thread"

[hookpoint."Camera.View"]
site    = 0x4C5068          # f_804e48c0, right after a view's matrix is written (ldr x8, [x19, #0x20])
slot    = 1
stub    = "kp_hook_view"
replaces = 0xF9401268       # ldr x8, [x19, #0x20]
context = "x19 = camera, x20 = view; every view (menus too), mid-function: all registers live"

[hookpoint."Pouch.Equip"]
site    = 0xA7ACD4          # second instruction of PouchEquip (f_80a9acd0), after its pacibsp
slot    = 2
stub    = "kp_hook_equip"
replaces = 0xD10603FF       # sub sp, sp, #0x180
menu    = "0x33A0000..0x33C0000"   # the pause menu's code: a call returning in here is the player's pick
context = "x0 = PouchMgr, x1 = the item's name (a string whose first word is the char pointer), w2 = mode, w3 = flag; function entry, lr signed; 21 callers (the menu, area loads, events)"

