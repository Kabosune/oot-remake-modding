# ---- the pause menu's table (UI/Pouch/PouchTable), as the game parsed it ----
# [[PouchMgr + PouchMgr.ui] + PouchUi.table] is the table. Its pages (CollectArray, EquipmentArray,
# ItemArray, ...) are arrays of 0x28 bytes from PouchTable.pages; an array holds its count at +8
# and a pointer to its elements at +0x10. A page's element is a button, whose Actor list is an
# array at PouchButton.items; each of those is an item. An item's bools have a "set here" byte
# each (0 = taken from the table's parent, or false). Getters f_80a8ffd0 (child), f_80a92a80 (adult).

