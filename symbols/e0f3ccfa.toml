# ---- globals ----

[global.CameraManagerSlot]
offset = 0x4C86BC0
ld     = "CAMMGR_SLOT"
note   = "[[slot]] = camera manager"
source = "Hookshot"

# ---- vtables (asked for as "vtable.<Name>") ----

[vtable.View]
offset = 0x4BF8A88
