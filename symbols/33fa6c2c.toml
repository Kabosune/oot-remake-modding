# KaeGae symbol pack for main build 33FA6C2C23848282A77E8B88A0A93F4887C55920 (game version 1.0.0).
#
# Ported from the 1.1.1 pack (e0f3ccfa.toml) on 17 November 2026 with tools/port_pack.py, against
# a 1.0.0 main dumped by Fritchii ("Dump Decompressed NSOs"), then finished by hand. Each entry's
# `port` line says how it was found. Same names, same meaning as in the 1.1.1 pack: a mod that runs
# on one runs on the other. Offsets are module offsets (address minus 0x80020000).
#
# Where the two versions really differ (not just in where things are), the entry's note says so.
# docs/game-versions.md has the comparison.

build   = "33FA6C2C23848282A77E8B88A0A93F4887C55920"
version = "1.0.0"

[detect]
nnmain = 0x11C1FB0
mod0   = 0x3BE705C
size   = 0x4E30000

[core]
hook-slots = 0x4E2FB00      # one 8-byte function pointer per hook point: the same spot from the end of
                            # .bss as in 1.1.1; nothing in 1.0.0 refers past 0x4E2A068 (registry/33fa6c2c.toml)
hook-code  = "0x3BE6900..0x3BE6A00"   # where Core's patch puts its hook stubs: in the zero padding after .text
                                     # (which ends at 0x3BE6850), before sloperinaGZ's claim

[hookpoint."Actor.MoveUpdate"]
site     = 0x2BCD714
slot     = 0
stub     = "kp_hook_move"
replaces = 0xFC180FEA
context  = "x0 = actor; runs for every physics actor every frame on the game's thread"
port     = "matched (1.1.1 0x2C215E4)"

[hookpoint."Camera.View"]
site     = 0x6641C8
slot     = 1
stub     = "kp_hook_view"
replaces = 0xF9401268
context  = "x19 = camera, x20 = view; every view (menus too), mid-function: all registers live"
port     = "matched (1.1.1 0x4C5068)"

