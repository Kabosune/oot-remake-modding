# KaeGae registry for main build 33FA6C2C23848282A77E8B88A0A93F4887C55920 (game version 1.0.0).
#
# Who uses which bytes of main: free space that mods may claim, and every claim on it. Same format
# as registry/e0f3ccfa.toml (api/MANIFEST.md, "The registry"). Surveyed on 17 November 2026 from a
# 1.0.0 main dumped by Fritchii. Lichii / Fritchii's built-in patches are for 1.1.1 only (their
# program names no other build), so nothing of theirs is here.

build   = "33FA6C2C23848282A77E8B88A0A93F4887C55920"
version = "1.0.0"

# ---- free space ----

[space.cave]
kind  = "code"
range = "0x3BE6850..0x3BE7000"
note  = ".text padding: 1968 bytes, executable, zero"

[space.bss-tail]
kind  = "memory"
range = "0x4E2A068..0x4E30000"
note  = "writable, zeroed at boot, referenced by nothing in the game (the last reference is 0x4E2A060)"

# ---- claims by mods that follow the standard ----

[[claim]]
owner  = "kaegae.core"
name   = "KaeGae Core"
code   = ["0x3BE6900..0x3BE6A00"]          # hook point stubs
memory = ["0x4E2FB00..0x4E2FC00"]          # one function pointer per hook point
hooks  = ["0x2BCD714",                     # hook point Actor.MoveUpdate
          "0x6641C8"]                      # hook point Camera.View

# ---- claims read from mods that don't follow the standard ----

[[claim]]
owner    = "practicerom.sloperinagz"
name     = "sloperinaGZ"
standard = false
code     = ["0x3BE6A00..0x3BE6A10", "0x3BE6A40..0x3BE6A54"]
hooks    = ["0x3AF2A6C"]
source   = "its 0.0.3 patch"
