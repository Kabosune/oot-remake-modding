# Mouse Grab's manifest: a core mod (no patches of its own; it runs on KaeGae Core).
manifest = 1

id       = "kabosune.mouse-grab"
name     = "Mouse Grab"
version  = "0.4.0"
authors  = ["KaboWabo/Kabosune"]
license  = "MIT"
homepage = "https://github.com/Kabosune/oot-remake-modding"

[game]
title = "0400486024DEC000"
tested = ["1.0.0", "1.1.1"]      # 0.4.0, Fritchii v5.8.4, 17 November 2026

[core]
api     = "0.8"
sources = ["module/*.c"]
events  = ["draw", "actor_move"]
# From 0.4.0 every game address comes from Core's symbol pack by name (module/symbols.c), so it runs
# on every game version Core has a pack for (1.0.0 and 1.1.1). The names below are checked against
# each pack when it's built. Needs Core 0.8.5 (the first with these names).
symbols = ["function:ActorHolder", "function:RagdollFind", "function:RagdollStart", "function:RagdollEnd",
           "function:RagdollDownPrepSpeed", "function:RagdollDownPrepA", "function:RagdollDownPrepB",
           "function:RagdollDownPrepState", "function:RagdollReaction", "function:RagdollReactionIsActive",
           "function:RagdollReactionEnd", "function:AsPlay", "function:BodySetLinearVelocity",
           "function:CctChangePosition", "global:IdentityQuatPtr", "global:RagdollDownNamesPtr",
           "global:GameCameraPtr", "vtable:vtable.Actor", "vtable:vtable.Player", "vtable:vtable.Cct",
           "vtable:vtable.CctBody"]

[core.imports]                # system functions the mod imports itself, and which module exports them
_ZN2nn3hid14GetMouseStatesEPNS0_10MouseStateEi = "sdk"
