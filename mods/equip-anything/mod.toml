# Equip Anything's manifest: a core mod (no patches of its own; it runs on KaeGae Core 0.9 and up).
manifest = 1

id          = "kabosune.equip-anything"
name        = "Equip Anything"
version     = "1.0.1"
authors     = ["KaboWabo/Kabosune"]
license     = "MIT"
homepage    = "https://github.com/Kabosune/oot-remake-modding"
description = "Child and adult Link can equip every item and piece of equipment, and picking an equipped one again takes it off."

[game]
title = "0400486024DEC000"

[core]
api     = "0.9"
sources = ["equip_anything.c"]
events  = ["frame", "pouch_equip"]
# Every game address comes from Core's symbol packs by name, so it runs on 1.0.0 and 1.1.1.
symbols = ["global:PouchMgrPtr", "field:PouchMgr.ui", "field:PouchUi.table", "field:PouchTable.pages",
           "field:PouchButton.items", "field:PouchItem.name", "field:PouchItem.usable_child",
           "field:PouchItem.usable_adult"]
