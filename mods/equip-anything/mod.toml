# Equip Anything's manifest: a romfs-only KaeGae package (no code, no Core needed).
manifest = 1

id          = "kabosune.equip-anything"
name        = "Equip Anything"
version     = "0.1.1"
authors     = ["KaboWabo/Kabosune"]
license     = "MIT"
homepage    = "https://github.com/Kabosune/oot-remake-modding"
description = "Child and adult Link can equip every item and piece of equipment in the pause menu."

[game]
title = "0400486024DEC000"

# The menu table grows by 424 bytes; the game builds the menu's objects in the memory this entry
# sets aside, so it needs more room (0.1.0 without it crashed at boot). 46,824 + 424 + 2,048 spare.
[[romfs-patch]]
kind     = "size-table"
path     = "UI/Pouch/PouchTable/PouchTable.game__ui__PouchTable.bgyml"
at-least = 49296
