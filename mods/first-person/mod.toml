# First Person's manifest: a level 2 mod (it patches main itself, in space taken from the registry).
manifest = 1

id       = "kabosune.first-person"
name     = "First Person"
version  = "1.2.0"
authors  = ["KaboWabo/Kabosune"]
license  = "MIT"
homepage = "https://github.com/Kabosune/oot-remake-modding"

[game]
title = "0400486024DEC000"

[build.E0F3CCFAF50065AE4EA01EB5AEB13B1A45DA3348]      # 1.1.1
ips    = "exefs/E0F3CCFAF50065AE4EA01EB5AEB13B1A45DA3348.ips"
code   = ["0x3C46B00..0x3C46FB0"]          # code written into main's padding (module offsets)
memory = ["0x4E9FC00..0x4E9FC40"]          # writable state
hooks  = ["0x4C5068", "0x2C21720"]         # instructions replaced by a branch: view matrix done, movement update

[input]                                     # actions and their default buttons
toggle     = "R3"
eye-down   = "key:,"
eye-up     = "key:."
eye-reset  = "key:/"
show-link  = "key:;"
